<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lucky Draw System</title>

        <!-- Google Fonts: Orbitron (headings/logo) + Share Tech Mono (body) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="style.css?v=2026050201" />

        <!-- Google Analytics -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-JE8BG98RRH"
        ></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());
            gtag("config", "G-JE8BG98RRH");
        </script>
    </head>
    <body>
        <!-- Animated starfield canvas (drawn by main.js) -->
        <canvas id="starfield" class="starfield-canvas"></canvas>

        <nav>
            <div class="container nav-content">
                <a href="#" class="logo">Lucky Draw</a>
                <div class="nav-links">
                    <a href="#" class="nav-link active" data-page="draw"
                        >Draw</a
                    >
                    <a href="#" class="nav-link" data-page="settings"
                        >Settings</a
                    >
                    <button id="btnResetStorage" class="reset-storage-btn">
                        Reset to Default
                    </button>
                </div>
            </div>
        </nav>

        <div class="container">
            <!-- ── Draw Page ──────────────────────────────────────────────────── -->
            <div id="drawPage">
                <div class="game-layout">
                    <div class="game-section">
                        <div class="game-controls">
                            <button id="btnResetGame" class="btn btn--danger">
                                Reset Game
                            </button>
                            <button
                                id="btnStartAnimation"
                                class="btn btn--primary"
                            >
                                Start Animation
                            </button>
                            <button
                                id="btnShuffleBoxes"
                                class="btn btn--purple"
                            >
                                Shuffle Boxes
                            </button>
                        </div>
                        <div class="boxes-container" id="boxesContainer"></div>
                    </div>
                    <div class="side-panel">
                        <h2>Prize Images</h2>
                        <div id="prizeImages"></div>
                    </div>
                </div>
            </div>

            <!-- ── Settings Page ──────────────────────────────────────────────── -->
            <div id="settingsPage" class="hidden">
                <div class="settings-container">
                    <div class="settings-section">
                        <h2>Prizes</h2>
                        <div class="prize-list" id="prizeList"></div>
                        <button
                            id="btnAddPrize"
                            class="btn btn--green"
                            style="margin-top: 15px"
                        >
                            Add Prize
                        </button>
                    </div>
                    <div id="noPrizeSettings" style="margin-top: 25px"></div>
                    <div id="animationSettings" style="margin-top: 25px"></div>
                </div>
            </div>
        </div>

        <!-- JS load order: state → render → animation → settings → navigation → main -->
        <script src="js/state.js?v=2026050201"></script>
        <script src="js/render.js?v=2026050201"></script>
        <script src="js/animation.js?v=2026050201"></script>
        <script src="js/settings.js?v=2026050201"></script>
        <script src="js/navigation.js?v=2026050201"></script>
        <script src="js/main.js?v=2026050201"></script>
    </body>
</html>
